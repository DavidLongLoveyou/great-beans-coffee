<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="worldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#worldBg)"/>
  
  <!-- World map silhouette (simplified) -->
  <g fill="#334155" opacity="0.3">
    <!-- North America -->
    <path d="M50,120 Q80,100 120,110 L150,120 Q180,130 170,160 L140,180 Q110,170 80,180 L50,170 Q30,150 50,120 Z"/>
    <!-- South America -->
    <path d="M120,200 Q140,180 160,190 L170,220 Q180,250 170,280 L160,310 Q140,320 120,310 L110,280 Q100,250 110,220 L120,200 Z"/>
    <!-- Europe -->
    <path d="M300,100 Q330,90 360,100 L380,110 Q390,120 380,140 L360,150 Q330,140 300,150 L280,140 Q270,120 300,100 Z"/>
    <!-- Africa -->
    <path d="M320,160 Q350,150 380,160 L400,180 Q410,220 400,260 L380,300 Q350,310 320,300 L300,260 Q290,220 300,180 L320,160 Z"/>
    <!-- Asia -->
    <path d="M450,110 Q500,100 550,110 L580,120 Q600,140 590,170 L570,200 Q540,190 510,200 L480,190 Q460,170 450,140 L450,110 Z"/>
  </g>
  
  <!-- Coffee production regions highlighted -->
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="130" cy="240" r="8"/> <!-- Brazil -->
    <circle cx="140" cy="200" r="6"/> <!-- Colombia -->
    <circle cx="560" cy="160" r="7"/> <!-- Vietnam -->
    <circle cx="380" cy="200" r="5"/> <!-- Ethiopia -->
    <circle cx="520" cy="180" r="4"/> <!-- Indonesia -->
  </g>
  
  <!-- Data visualization panel -->
  <rect x="450" y="50" width="320" height="280" fill="rgba(255,255,255,0.95)" rx="12" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Chart title -->
  <text x="610" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
    Market Data 2024
  </text>
  
  <!-- Bar chart -->
  <g transform="translate(480,100)">
    <!-- Chart axes -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#6b7280" stroke-width="2"/>
    <line x1="0" y1="180" x2="260" y2="180" stroke="#6b7280" stroke-width="2"/>
    
    <!-- Bars -->
    <rect x="20" y="60" width="30" height="120" fill="url(#chartBg)" rx="2"/>
    <rect x="70" y="40" width="30" height="140" fill="url(#chartBg)" rx="2"/>
    <rect x="120" y="80" width="30" height="100" fill="url(#chartBg)" rx="2"/>
    <rect x="170" y="20" width="30" height="160" fill="url(#chartBg)" rx="2"/>
    <rect x="220" y="50" width="30" height="130" fill="url(#chartBg)" rx="2"/>
    
    <!-- Bar labels -->
    <text x="35" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Brazil</text>
    <text x="85" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Vietnam</text>
    <text x="135" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Colombia</text>
    <text x="185" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Indonesia</text>
    <text x="235" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Ethiopia</text>
  </g>
  
  <!-- Trend line chart -->
  <g transform="translate(480,240)">
    <text x="130" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2937">
      Price Trends
    </text>
    
    <!-- Grid lines -->
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="0" y1="20" x2="260" y2="20"/>
      <line x1="0" y1="40" x2="260" y2="40"/>
      <line x1="0" y1="60" x2="260" y2="60"/>
    </g>
    
    <!-- Trend line -->
    <polyline points="0,60 50,45 100,35 150,25 200,30 260,20" 
              fill="none" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Data points -->
    <circle cx="0" cy="60" r="3" fill="#f59e0b"/>
    <circle cx="50" cy="45" r="3" fill="#f59e0b"/>
    <circle cx="100" cy="35" r="3" fill="#f59e0b"/>
    <circle cx="150" cy="25" r="3" fill="#f59e0b"/>
    <circle cx="200" cy="30" r="3" fill="#f59e0b"/>
    <circle cx="260" cy="20" r="3" fill="#f59e0b"/>
  </g>
  
  <!-- Coffee beans decoration -->
  <g fill="#8B4513" opacity="0.6">
    <ellipse cx="80" cy="80" rx="3" ry="5" transform="rotate(15 80 80)"/>
    <ellipse cx="120" cy="60" rx="3" ry="5" transform="rotate(-20 120 60)"/>
    <ellipse cx="200" cy="90" rx="3" ry="5" transform="rotate(30 200 90)"/>
    <ellipse cx="250" cy="70" rx="3" ry="5" transform="rotate(-10 250 70)"/>
  </g>
  
  <!-- Title section -->
  <rect x="50" y="30" width="650" height="70" fill="rgba(255,255,255,0.95)" rx="8"/>
  <text x="375" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1f2937">
    Global Coffee Market Trends
  </text>
  <text x="375" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#f59e0b">
    2024 Data-Driven Insights
  </text>
  
  <!-- Growth indicators -->
  <g transform="translate(350,350)">
    <rect x="0" y="0" width="100" height="30" fill="rgba(16,185,129,0.1)" rx="4"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669">
      ↗ +5.2% Growth
    </text>
  </g>
  
  <!-- Global connectivity lines -->
  <g stroke="#fbbf24" stroke-width="1" opacity="0.4">
    <line x1="130" y1="240" x2="560" y2="160"/> <!-- Brazil to Vietnam -->
    <line x1="140" y1="200" x2="380" y2="200"/> <!-- Colombia to Ethiopia -->
    <line x1="560" y1="160" x2="520" y2="180"/> <!-- Vietnam to Indonesia -->
  </g>
</svg>