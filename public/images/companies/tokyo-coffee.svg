<svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
  <defs>
    <linearGradient id="tokyoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Japanese-inspired circle -->
  <circle cx="20" cy="20" r="12" fill="none" stroke="url(#tokyoGradient)" stroke-width="2" />
  <circle cx="20" cy="20" r="6" fill="url(#tokyoGradient)" />
  
  <!-- Company name -->
  <text x="40" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#22c55e">
    Tokyo Coffee
  </text>
  <text x="40" y="30" font-family="Inter, sans-serif" font-size="8" fill="#16a34a">
    東京コーヒー
  </text>
</svg>