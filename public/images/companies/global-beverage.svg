<svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
  <defs>
    <linearGradient id="globalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Globe representation -->
  <circle cx="20" cy="20" r="12" fill="none" stroke="url(#globalGradient)" stroke-width="2" />
