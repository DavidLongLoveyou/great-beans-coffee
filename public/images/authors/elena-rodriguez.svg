<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="faceGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  
  <!-- Face background -->
  <circle cx="100" cy="90" r="60" fill="url(#faceGradient)"/>
  
  <!-- Hair -->
  <ellipse cx="100" cy="70" rx="45" ry="35" fill="#8B4513"/>
  
  <!-- Face -->
  <ellipse cx="100" cy="95" rx="35" ry="40" fill="#D2B48C"/>
  
  <!-- Eyes -->
  <ellipse cx="90" cy="85" rx="4" ry="6" fill="#2D4A22"/>
  <ellipse cx="110" cy="85" rx="4" ry="6" fill="#2D4A22"/>
  <ellipse cx="90" cy="83" rx="2" ry="3" fill="white"/>
  <ellipse cx="110" cy="83" rx="2" ry="3" fill="white"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="95" rx="2" ry="4" fill="#C19A6B"/>
  
  <!-- Mouth -->
  <ellipse cx="100" cy="105" rx="6" ry="3" fill="#CD5C5C"/>
  
  <!-- Professional attire -->
  <rect x="70" y="130" width="60" height="70" fill="#2C3E50" rx="5"/>
  <rect x="75" y="135" width="50" height="60" fill="#34495E" rx="3"/>
  
  <!-- Coffee expertise symbol -->
  <circle cx="160" cy="60" r="25" fill="rgba(255,255,255,0.9)"/>
  <g transform="translate(150,50)">
    <!-- Coffee bean -->
    <ellipse cx="10" cy="10" rx="8" ry="6" fill="#8B4513"/>
    <path d="M 6 10 Q 10 6 14 10 Q 10 14 6 10" fill="#654321"/>
  </g>
  
  <!-- Name and title -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">
    Elena Rodriguez
  </text>
  <text x="100" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">
    Coffee Processing Expert
  </text>
</svg>