<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="packageGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Factory/Production background -->
  <g opacity="0.1">
    <rect x="0" y="300" width="800" height="100" fill="#64748b"/>
    <rect x="50" y="250" width="80" height="50" fill="#475569"/>
    <rect x="150" y="270" width="60" height="30" fill="#475569"/>
    <rect x="230" y="260" width="70" height="40" fill="#475569"/>
  </g>
  
  <!-- Coffee bags/packages -->
  <g transform="translate(100,150)">
    <!-- Package 1 - Premium brand -->
    <rect x="0" y="0" width="80" height="120" fill="url(#packageGradient)" rx="5" filter="url(#shadow)"/>
    <rect x="5" y="5" width="70" height="30" fill="url(#goldGradient)" rx="3"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">PREMIUM</text>
    <rect x="10" y="45" width="60" height="40" fill="#065f46" rx="3"/>
    <text x="40" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">YOUR</text>
    <text x="40" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">BRAND</text>
    <text x="40" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">COFFEE</text>
    <!-- Coffee beans illustration -->
    <g fill="#8B4513">
      <ellipse cx="20" cy="100" rx="3" ry="2"/>
      <ellipse cx="30" cy="105" rx="3" ry="2"/>
      <ellipse cx="40" cy="98" rx="3" ry="2"/>
      <ellipse cx="50" cy="103" rx="3" ry="2"/>
      <ellipse cx="60" cy="100" rx="3" ry="2"/>
    </g>
  </g>
  
  <g transform="translate(220,140)">
    <!-- Package 2 - Different design -->
    <rect x="0" y="0" width="85" height="130" fill="url(#packageGradient)" rx="5" filter="url(#shadow)"/>
    <rect x="5" y="5" width="75" height="35" fill="#dc2626" rx="3"/>
    <text x="42.5" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">CUSTOM BLEND</text>
    <rect x="10" y="50" width="65" height="45" fill="#1f2937" rx="3"/>
    <text x="42.5" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">ARTISAN</text>
    <text x="42.5" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">ROASTED</text>
    <text x="42.5" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">COFFEE</text>
    <!-- Coffee beans -->
    <g fill="#654321">
      <ellipse cx="25" cy="110" rx="3" ry="2"/>
      <ellipse cx="35" cy="115" rx="3" ry="2"/>
      <ellipse cx="45" cy="108" rx="3" ry="2"/>
      <ellipse cx="55" cy="113" rx="3" ry="2"/>
      <ellipse cx="65" cy="110" rx="3" ry="2"/>
    </g>
  </g>
  
  <g transform="translate(340,160)">
    <!-- Package 3 - Minimalist design -->
    <rect x="0" y="0" width="75" height="110" fill="url(#packageGradient)" rx="5" filter="url(#shadow)"/>
    <rect x="5" y="5" width="65" height="25" fill="#059669" rx="3"/>
    <text x="37.5" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">ORGANIC</text>
    <circle cx="37.5" cy="55" r="20" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="37.5" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#374151">COFFEE</text>
    <!-- Coffee beans -->
    <g fill="#92400e">
      <ellipse cx="20" cy="85" rx="2.5" ry="1.5"/>
      <ellipse cx="30" cy="90" rx="2.5" ry="1.5"/>
      <ellipse cx="40" cy="83" rx="2.5" ry="1.5"/>
      <ellipse cx="50" cy="88" rx="2.5" ry="1.5"/>
    </g>
  </g>
  
  <!-- Production equipment -->
  <g transform="translate(500,180)">
    <!-- Roasting machine -->
    <rect x="0" y="0" width="120" height="80" fill="#374151" rx="10" filter="url(#shadow)"/>
    <circle cx="30" cy="40" r="15" fill="#6b7280"/>
    <circle cx="30" cy="40" r="10" fill="#4b5563"/>
    <circle cx="90" cy="40" r="15" fill="#6b7280"/>
    <circle cx="90" cy="40" r="10" fill="#4b5563"/>
    <!-- Control panel -->
    <rect x="45" y="15" width="30" height="50" fill="#1f2937" rx="3"/>
    <circle cx="52" cy="25" r="3" fill="#ef4444"/>
    <circle cx="60" cy="25" r="3" fill="#22c55e"/>
    <circle cx="68" cy="25" r="3" fill="#eab308"/>
    <rect x="48" y="35" width="20" height="3" fill="#64748b"/>
    <rect x="48" y="42" width="20" height="3" fill="#64748b"/>
    <rect x="48" y="49" width="20" height="3" fill="#64748b"/>
    <rect x="48" y="56" width="20" height="3" fill="#64748b"/>
  </g>
  
  <!-- Quality control elements -->
  <g transform="translate(650,200)">
    <!-- Scale/measuring device -->
    <rect x="0" y="0" width="60" height="40" fill="#e5e7eb" rx="5" filter="url(#shadow)"/>
    <rect x="5" y="5" width="50" height="20" fill="#1f2937" rx="2"/>
    <text x="30" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">QUALITY</text>
    <rect x="15" y="30" width="30" height="5" fill="#6b7280" rx="2"/>
    <!-- Sample beans -->
    <g fill="#8B4513">
      <circle cx="10" cy="50" r="2"/>
      <circle cx="20" cy="55" r="2"/>
      <circle cx="30" cy="52" r="2"/>
      <circle cx="40" cy="57" r="2"/>
      <circle cx="50" cy="54" r="2"/>
    </g>
  </g>
  
  <!-- Branding elements -->
  <g transform="translate(450,80)">
    <!-- Design tools -->
    <rect x="0" y="0" width="100" height="60" fill="white" rx="5" filter="url(#shadow)"/>
    <rect x="5" y="5" width="90" height="35" fill="#f8fafc" rx="3"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">Brand Design</text>
    <text x="50" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Custom Solutions</text>
    <!-- Color palette -->
    <rect x="10" y="45" width="8" height="8" fill="#fbbf24"/>
    <rect x="22" y="45" width="8" height="8" fill="#065f46"/>
    <rect x="34" y="45" width="8" height="8" fill="#dc2626"/>
    <rect x="46" y="45" width="8" height="8" fill="#1f2937"/>
    <rect x="58" y="45" width="8" height="8" fill="#059669"/>
    <rect x="70" y="45" width="8" height="8" fill="#7c3aed"/>
    <rect x="82" y="45" width="8" height="8" fill="#ea580c"/>
  </g>
  
  <!-- Process flow arrows -->
  <g stroke="url(#goldGradient)" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="url(#goldGradient)"/>
      </marker>
    </defs>
    <path d="M 180 210 Q 220 190 260 210"/>
    <path d="M 305 210 Q 340 190 380 210"/>
    <path d="M 415 210 Q 450 190 500 210"/>
  </g>
  
  <!-- Title and description -->
  <rect x="50" y="30" width="500" height="80" fill="rgba(255,255,255,0.95)" rx="10" filter="url(#shadow)"/>
  <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#065f46">
    Private Label Coffee Solutions
  </text>
  <text x="300" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
    From Bean Selection to Brand Creation
  </text>
  <text x="300" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    Custom Roasting • Packaging Design • Quality Assurance • Brand Development
  </text>
</svg>