<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7C59;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="650" cy="80" r="40" fill="url(#sunGradient)"/>
  
  <!-- Mountains -->
  <polygon points="0,250 150,150 300,200 450,120 600,180 800,160 800,400 0,400" fill="url(#mountainGradient)"/>
  
  <!-- Coffee plants -->
  <g transform="translate(100,220)">
    <!-- Plant stem -->
    <rect x="48" y="0" width="4" height="120" fill="#8B4513"/>
    <!-- Coffee beans -->
    <ellipse cx="45" cy="30" rx="8" ry="12" fill="#8B0000"/>
    <ellipse cx="55" cy="35" rx="8" ry="12" fill="#DC143C"/>
    <ellipse cx="40" cy="50" rx="8" ry="12" fill="#B22222"/>
    <ellipse cx="58" cy="55" rx="8" ry="12" fill="#8B0000"/>
    <!-- Leaves -->
    <ellipse cx="35" cy="25" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(-30 35 25)"/>
    <ellipse cx="65" cy="30" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(30 65 30)"/>
    <ellipse cx="30" cy="45" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(-45 30 45)"/>
    <ellipse cx="70" cy="50" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(45 70 50)"/>
  </g>
  
  <!-- Second coffee plant -->
  <g transform="translate(250,240)">
    <rect x="48" y="0" width="4" height="100" fill="#8B4513"/>
    <ellipse cx="42" cy="25" rx="8" ry="12" fill="#DC143C"/>
    <ellipse cx="58" cy="30" rx="8" ry="12" fill="#8B0000"/>
    <ellipse cx="38" cy="45" rx="8" ry="12" fill="#B22222"/>
    <ellipse cx="32" cy="20" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(-30 32 20)"/>
    <ellipse cx="68" cy="25" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(30 68 25)"/>
    <ellipse cx="28" cy="40" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(-45 28 40)"/>
  </g>
  
  <!-- Third coffee plant -->
  <g transform="translate(400,230)">
    <rect x="48" y="0" width="4" height="110" fill="#8B4513"/>
    <ellipse cx="44" cy="28" rx="8" ry="12" fill="#8B0000"/>
    <ellipse cx="56" cy="33" rx="8" ry="12" fill="#DC143C"/>
    <ellipse cx="40" cy="48" rx="8" ry="12" fill="#B22222"/>
    <ellipse cx="60" cy="53" rx="8" ry="12" fill="#8B0000"/>
    <ellipse cx="34" cy="23" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(-30 34 23)"/>
    <ellipse cx="66" cy="28" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(30 66 28)"/>
    <ellipse cx="30" cy="43" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(-45 30 43)"/>
    <ellipse cx="70" cy="48" rx="15" ry="8" fill="url(#leafGradient)" transform="rotate(45 70 48)"/>
  </g>
  
  <!-- Sustainability symbols -->
  <!-- Recycling symbol -->
  <g transform="translate(550,280)">
    <path d="M0,20 Q-10,0 0,-20 Q10,0 0,20" stroke="#228B22" stroke-width="3" fill="none"/>
    <path d="M20,10 Q20,-10 0,-20 Q-20,-10 -20,10" stroke="#228B22" stroke-width="3" fill="none" transform="rotate(120)"/>
    <path d="M20,10 Q20,-10 0,-20 Q-20,-10 -20,10" stroke="#228B22" stroke-width="3" fill="none" transform="rotate(240)"/>
  </g>
  
  <!-- Title overlay -->
  <rect x="50" y="50" width="500" height="80" fill="rgba(255,255,255,0.9)" rx="10"/>
  <text x="300" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2D5016">
    Sustainable Coffee Sourcing
  </text>
  <text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4A7C59">
    Vietnam Guide
  </text>
</svg>