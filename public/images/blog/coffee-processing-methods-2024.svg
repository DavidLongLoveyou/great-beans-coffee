<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Washed Process Section -->
  <g transform="translate(50,80)">
    <rect x="0" y="0" width="200" height="120" fill="white" rx="10" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46">Washed Process</text>
    
    <!-- Water tank -->
    <rect x="20" y="30" width="60" height="40" fill="#3b82f6" rx="5"/>
    <rect x="25" y="35" width="50" height="25" fill="#60a5fa" rx="3"/>
    
    <!-- Coffee cherries in water -->
    <g fill="#dc2626">
      <circle cx="35" cy="45" r="3"/>
      <circle cx="45" cy="50" r="3"/>
      <circle cx="55" cy="47" r="3"/>
      <circle cx="65" cy="52" r="3"/>
    </g>
    
    <!-- Fermentation tank -->
    <rect x="100" y="30" width="60" height="40" fill="#6b7280" rx="5"/>
    <rect x="105" y="35" width="50" height="25" fill="#9ca3af" rx="3"/>
    
    <!-- Beans fermenting -->
    <g fill="#8B4513">
      <ellipse cx="115" cy="45" rx="3" ry="2"/>
      <ellipse cx="125" cy="50" rx="3" ry="2"/>
      <ellipse cx="135" cy="47" rx="3" ry="2"/>
      <ellipse cx="145" cy="52" rx="3" ry="2"/>
    </g>
    
    <!-- Drying bed -->
    <rect x="20" y="80" width="140" height="20" fill="#d97706" rx="3"/>
    <g fill="#92400e">
      <ellipse cx="40" cy="90" rx="2" ry="1"/>
      <ellipse cx="60" cy="90" rx="2" ry="1"/>
      <ellipse cx="80" cy="90" rx="2" ry="1"/>
      <ellipse cx="100" cy="90" rx="2" ry="1"/>
      <ellipse cx="120" cy="90" rx="2" ry="1"/>
      <ellipse cx="140" cy="90" rx="2" ry="1"/>
    </g>
  </g>
  
  <!-- Natural Process Section -->
  <g transform="translate(300,80)">
    <rect x="0" y="0" width="200" height="120" fill="white" rx="10" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Natural Process</text>
    
    <!-- Drying beds with cherries -->
    <rect x="20" y="30" width="160" height="25" fill="#d97706" rx="3"/>
    <g fill="#dc2626">
      <circle cx="35" cy="42" r="4"/>
      <circle cx="55" cy="42" r="4"/>
      <circle cx="75" cy="42" r="4"/>
      <circle cx="95" cy="42" r="4"/>
      <circle cx="115" cy="42" r="4"/>
      <circle cx="135" cy="42" r="4"/>
      <circle cx="155" cy="42" r="4"/>
    </g>
    
    <!-- Sun -->
    <circle cx="100" cy="70" r="15" fill="#fbbf24"/>
    <g stroke="#f59e0b" stroke-width="2">
      <line x1="85" y1="70" x2="75" y2="70"/>
      <line x1="115" y1="70" x2="125" y2="70"/>
      <line x1="100" y1="55" x2="100" y2="45"/>
      <line x1="100" y1="85" x2="100" y2="95"/>
      <line x1="89" y1="59" x2="82" y2="52"/>
      <line x1="111" y1="81" x2="118" y2="88"/>
      <line x1="111" y1="59" x2="118" y2="52"/>
      <line x1="89" y1="81" x2="82" y2="88"/>
    </g>
    
    <!-- Final dried beans -->
    <rect x="20" y="100" width="160" height="15" fill="#8B4513" rx="2"/>
    <g fill="#654321">
      <ellipse cx="40" cy="107" rx="3" ry="2"/>
      <ellipse cx="60" cy="107" rx="3" ry="2"/>
      <ellipse cx="80" cy="107" rx="3" ry="2"/>
      <ellipse cx="100" cy="107" rx="3" ry="2"/>
      <ellipse cx="120" cy="107" rx="3" ry="2"/>
      <ellipse cx="140" cy="107" rx="3" ry="2"/>
      <ellipse cx="160" cy="107" rx="3" ry="2"/>
    </g>
  </g>
  
  <!-- Honey Process Section -->
  <g transform="translate(550,80)">
    <rect x="0" y="0" width="200" height="120" fill="white" rx="10" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">Honey Process</text>
    
    <!-- Pulping machine -->
    <rect x="20" y="30" width="50" height="30" fill="#6b7280" rx="5"/>
    <circle cx="45" cy="45" r="8" fill="#4b5563"/>
    
    <!-- Cherries going in -->
    <g fill="#dc2626">
      <circle cx="15" cy="35" r="2"/>
      <circle cx="10" cy="40" r="2"/>
      <circle cx="12" cy="45" r="2"/>
    </g>
    
    <!-- Mucilage-covered beans coming out -->
    <g fill="#f59e0b">
      <ellipse cx="80" cy="40" rx="4" ry="3"/>
      <ellipse cx="90" cy="45" rx="4" ry="3"/>
      <ellipse cx="100" cy="42" rx="4" ry="3"/>
    </g>
    
    <!-- Drying with mucilage -->
    <rect x="20" y="70" width="160" height="20" fill="#d97706" rx="3"/>
    <g fill="#f59e0b">
      <ellipse cx="40" cy="80" rx="3" ry="2"/>
      <ellipse cx="60" cy="80" rx="3" ry="2"/>
      <ellipse cx="80" cy="80" rx="3" ry="2"/>
      <ellipse cx="100" cy="80" rx="3" ry="2"/>
      <ellipse cx="120" cy="80" rx="3" ry="2"/>
      <ellipse cx="140" cy="80" rx="3" ry="2"/>
      <ellipse cx="160" cy="80" rx="3" ry="2"/>
    </g>
    
    <!-- Final product -->
    <rect x="20" y="100" width="160" height="15" fill="#92400e" rx="2"/>
  </g>
  
  <!-- Quality comparison chart -->
  <g transform="translate(100,250)">
    <rect x="0" y="0" width="600" height="100" fill="rgba(255,255,255,0.9)" rx="10" filter="url(#shadow)"/>
    <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#065f46">
      Processing Methods Quality Impact
    </text>
    
    <!-- Chart bars -->
    <g transform="translate(50,40)">
      <!-- Washed -->
      <rect x="0" y="30" width="40" height="20" fill="#3b82f6"/>
      <text x="20" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Clean</text>
      <text x="20" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">Washed</text>
      
      <!-- Natural -->
      <rect x="100" y="20" width="40" height="30" fill="#dc2626"/>
      <text x="120" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Fruity</text>
      <text x="120" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">Natural</text>
      
      <!-- Honey -->
      <rect x="200" y="25" width="40" height="25" fill="#f59e0b"/>
      <text x="220" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Sweet</text>
      <text x="220" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">Honey</text>
      
      <!-- Legend -->
      <text x="300" y="35" font-family="Arial, sans-serif" font-size="12" fill="#374151">Flavor Intensity</text>
      <text x="300" y="50" font-family="Arial, sans-serif" font-size="12" fill="#374151">Body & Sweetness</text>
    </g>
  </g>
  
  <!-- Title -->
  <rect x="200" y="20" width="400" height="50" fill="rgba(255,255,255,0.95)" rx="10" filter="url(#shadow)"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#065f46">
    Coffee Processing Methods
  </text>
  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Impact on Quality & Flavor Profile
  </text>
</svg>