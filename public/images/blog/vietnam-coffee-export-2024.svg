<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Vietnam map outline (simplified) -->
  <g transform="translate(50,100)">
    <path d="M50,20 Q60,10 70,25 L75,40 Q80,60 75,80 L70,100 Q65,120 60,140 L55,160 Q50,180 45,200 L40,220 Q35,240 30,260 L25,280 Q20,300 25,320 L30,340 Q40,350 50,345 L60,340 Q70,335 75,325 L80,315 Q85,305 80,295 L75,285 Q70,275 65,265 L60,255 Q55,245 60,235 L65,225 Q70,215 65,205 L60,195 Q55,185 60,175 L65,165 Q70,155 65,145 L60,135 Q55,125 60,115 L65,105 Q70,95 65,85 L60,75 Q55,65 60,55 L65,45 Q70,35 65,25 L60,15 Q55,5 50,20 Z" 
          fill="#fbbf24" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Chart area -->
  <rect x="250" y="80" width="500" height="240" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="8"/>
  
  <!-- Chart grid lines -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="1">
    <line x1="250" y1="120" x2="750" y2="120"/>
    <line x1="250" y1="160" x2="750" y2="160"/>
    <line x1="250" y1="200" x2="750" y2="200"/>
    <line x1="250" y1="240" x2="750" y2="240"/>
    <line x1="250" y1="280" x2="750" y2="280"/>
    
    <line x1="300" y1="80" x2="300" y2="320"/>
    <line x1="400" y1="80" x2="400" y2="320"/>
    <line x1="500" y1="80" x2="500" y2="320"/>
    <line x1="600" y1="80" x2="600" y2="320"/>
    <line x1="700" y1="80" x2="700" y2="320"/>
  </g>
  
  <!-- Export trend line -->
  <polyline points="300,280 400,240 500,200 600,160 700,120" 
            fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
  
  <!-- Data points -->
  <circle cx="300" cy="280" r="6" fill="#fbbf24"/>
  <circle cx="400" cy="240" r="6" fill="#fbbf24"/>
  <circle cx="500" cy="200" r="6" fill="#fbbf24"/>
  <circle cx="600" cy="160" r="6" fill="#fbbf24"/>
  <circle cx="700" cy="120" r="6" fill="#fbbf24"/>
  
  <!-- Chart bars for volume -->
  <rect x="320" y="260" width="30" height="60" fill="url(#chartGradient)" rx="2"/>
  <rect x="420" y="220" width="30" height="100" fill="url(#chartGradient)" rx="2"/>
  <rect x="520" y="180" width="30" height="140" fill="url(#chartGradient)" rx="2"/>
  <rect x="620" y="140" width="30" height="180" fill="url(#chartGradient)" rx="2"/>
  <rect x="720" y="100" width="30" height="220" fill="url(#chartGradient)" rx="2"/>
  
  <!-- Coffee beans scattered -->
  <g fill="#8B4513">
    <ellipse cx="180" cy="150" rx="4" ry="6" transform="rotate(15 180 150)"/>
    <ellipse cx="200" cy="180" rx="4" ry="6" transform="rotate(-20 200 180)"/>
    <ellipse cx="160" cy="200" rx="4" ry="6" transform="rotate(30 160 200)"/>
    <ellipse cx="190" cy="220" rx="4" ry="6" transform="rotate(-10 190 220)"/>
    <ellipse cx="170" cy="240" rx="4" ry="6" transform="rotate(25 170 240)"/>
  </g>
  
  <!-- Shipping container icon -->
  <g transform="translate(650,250)">
    <rect x="0" y="0" width="80" height="40" fill="#374151" rx="4"/>
    <rect x="5" y="5" width="70" height="30" fill="#6b7280" rx="2"/>
    <rect x="10" y="10" width="15" height="20" fill="#9ca3af"/>
    <rect x="30" y="10" width="15" height="20" fill="#9ca3af"/>
    <rect x="50" y="10" width="15" height="20" fill="#9ca3af"/>
    <!-- Wheels -->
    <circle cx="15" cy="45" r="8" fill="#374151"/>
    <circle cx="65" cy="45" r="8" fill="#374151"/>
  </g>
  
  <!-- Title and year -->
  <rect x="50" y="30" width="700" height="60" fill="rgba(255,255,255,0.95)" rx="8"/>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e3a8a">
    Vietnam Coffee Export Trends
  </text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#f59e0b">
    2024 Market Analysis
  </text>
  
  <!-- Chart labels -->
  <text x="270" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2020</text>
  <text x="370" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2021</text>
  <text x="470" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2022</text>
  <text x="570" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2023</text>
  <text x="670" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2024</text>
  
  <!-- Arrow indicating growth -->
  <g transform="translate(680,140)">
    <path d="M0,0 L20,-10 L15,-5 L25,-5 L25,5 L15,5 L20,10 Z" fill="#10b981"/>
  </g>
</svg>